<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infulencer Gear</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="poppins-regular">
    <header>
        <section class="nav-section">
            <div class="logo">
                <a href="#">Influencer products</a>
            </div>
            <div class="nav-bars">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">products</a></li>
                    <li><a href="#">Sign up</a></li>
                    <li><a href="#">Log in</a></li>
                    <li><a href="#">Search</a></li>
                    <li><a href="#">To Cart</a></li>
                </ul>
            </div>
        </section>
    </header>
    <main>
        <section class="hero">
            <div class="hero-info">
                <h1 class="hero-title">Start your Journey as <br>
                    Influencer
                </h1>
                <p class="hero-details">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem vestibulum sed scelerisque eros. Lectus faucibus.</p>
                <button class="btn-primary">
                    <span>Prebook now</span>
                    <span class="class-arrow">-></span>
                </button>
            </div>
            <div class="hero-img">
                <img src="./images/main-camera.png" alt="" class="hero-bg">
            </div>
        </section>
        <section class="hero-footer">
            <img src="./logos/Alibaba.svg" alt="Alibaba">
            <img src="./logos/Amazon.svg" alt="Amazon">
            <img src="./logos/Daraz.pk Logo.svg" alt="Daraz">
            <img src="./logos/Ebay.svg" alt="Ebay">
            <img src="./logos/Rakuten.svg" alt="Rakuten">
            <img src="./logos/Target.svg" alt="Target">
            <img src="./logos/Walmart.svg" alt="Walmart">
        </section>
    </main>
</body>

</html>
